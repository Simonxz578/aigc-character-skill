[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-character-media"
version = "2.0.0"
description = "Character direction, optional local voice/video adapters and deterministic video finishing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
render = ["numpy>=1.26", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
aigc-character-mcp = "aigc_character_media.mcp_server:main"
aigc-character-voice = "aigc_character_media.local_voice:main"
aigc-character-local-video = "aigc_character_media.local_video:main"
aigc-character-finish = "aigc_character_media.finishing:main"

[tool.setuptools.packages.find]
where = ["src"]
